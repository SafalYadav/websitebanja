# automation/n8n/ops/docker-compose.prod.yml
# ==============================================================================
# WebsiteBanja AI — Production n8n Ops Agent Docker Compose Specification
# Phase: Phase 24 (Production Infrastructure)
# Target: Azure Container Apps / Production Container Host
# Architecture:
#   - Connected to Azure Database for PostgreSQL (Flexible Server)
#   - Non-root container security
#   - Encrypted credentials & secrets via environment variables
#   - Strictly separated from local dev n8n (no localhost sharing)
# ==============================================================================

version: '3.8'

services:
  n8n-ops-agent:
    image: n8nio/n8n:latest
    container_name: websitebanja-n8n-ops-prod
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Network & Routing
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_HOST=${N8N_HOST:-n8n-app.salmondesert-9c3e03bc.centralindia.azurecontainerapps.io}
      - WEBHOOK_URL=https://${N8N_HOST:-n8n-app.salmondesert-9c3e03bc.centralindia.azurecontainerapps.io}/
      - GENERIC_TIMEZONE=UTC
      
      # Persistence: Azure Database for PostgreSQL Flexible Server
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${AZURE_DB_HOST:-websitebanja-db.postgres.database.azure.com}
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${AZURE_DB_USER:-websitebanjaadmin}
      - DB_POSTGRESDB_PASSWORD=${AZURE_DB_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=public
      - DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=true
      
      # Security & Key Management
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_AUTH_EXCLUDE_ENDPOINTS=/healthz,/webhook/*
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      
      # AI & Tool Integration
      - N8N_AI_ENABLED=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168 # 7 days retention
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50000
      
      # WebsiteBanja Integration
      - WEBSITEBANJA_CORE_URL=https://websitebanja.com
      - WEBSITEBANJA_AUTOMATION_SECRET=${WEBSITEBANJA_AUTOMATION_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
