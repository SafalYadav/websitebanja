name: Continuous Deployment to Azure Container Apps

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/diagnose-db.yml'
      - '.github/workflows/billing-cron.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_SERVER: websitebanjacr.azurecr.io
  IMAGE_NAME: websitebanja
  CONTAINER_APP_NAME: websitebanja-app
  RESOURCE_GROUP: websitebanja-rg

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image (Immutable SHA + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-and-verify:
    name: Deploy to Azure Container Apps & Verify
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code (for smoke test script)
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Azure Authentication Secrets
        run: |
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "::error::AZURE_CLIENT_ID secret is not set in GitHub repository."
            echo "Please run './azure-migration/12_setup_github_oidc.sh' in Azure Cloud Shell"
            echo "and set AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID in GitHub Secrets."
            exit 1
          fi

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure External n8n Ops Agent in Azure
        id: n8n-deploy
        continue-on-error: true
        env:
          WEBSITEBANJA_AUTOMATION_SECRET: ${{ secrets.WEBSITEBANJA_AUTOMATION_SECRET }}
        run: |
          echo "Checking external n8n Ops Agent Container App in $RESOURCE_GROUP..."
          if ! az containerapp show --name n8n-app --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Creating n8n-app Container App..."
            az containerapp create \
              --name n8n-app \
              --resource-group "$RESOURCE_GROUP" \
              --environment websitebanja-env \
              --image n8nio/n8n:latest \
              --target-port 5678 \
              --ingress external \
              --cpu 0.5 \
              --memory 1.0Gi \
              --min-replicas 1 \
              --max-replicas 1 \
              --secrets "automation-secret=${WEBSITEBANJA_AUTOMATION_SECRET}" \
              --env-vars \
                N8N_PORT="5678" \
                N8N_PROTOCOL="https" \
                GENERIC_TIMEZONE="UTC" \
                N8N_AI_ENABLED="true" \
                N8N_DIAGNOSTICS_ENABLED="false" \
                N8N_BLOCK_ENV_ACCESS_IN_NODE="false" \
                AUTOMATION_SECRET="secretref:automation-secret" \
                WEBSITEBANJA_AUTOMATION_SECRET="secretref:automation-secret"
          else
            echo "Syncing secret and env vars on existing n8n-app..."
            az containerapp secret set \
              --name n8n-app \
              --resource-group "$RESOURCE_GROUP" \
              --secrets "automation-secret=${WEBSITEBANJA_AUTOMATION_SECRET}"

            az containerapp update \
              --name n8n-app \
              --resource-group "$RESOURCE_GROUP" \
              --set-env-vars \
                N8N_BLOCK_ENV_ACCESS_IN_NODE="false" \
                AUTOMATION_SECRET="secretref:automation-secret" \
                WEBSITEBANJA_AUTOMATION_SECRET="secretref:automation-secret"
          fi

          N8N_FQDN=$(az containerapp show --name n8n-app --resource-group "$RESOURCE_GROUP" --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || echo "")
          if [ -n "$N8N_FQDN" ]; then
            echo "n8n FQDN: https://${N8N_FQDN}"
            echo "N8N_OPS_AGENT_WEBHOOK_URL=https://${N8N_FQDN}/webhook/wb-ops-agent" >> "$GITHUB_ENV"
          else
            echo "Setting standard managed environment webhook for n8n-app..."
            echo "N8N_OPS_AGENT_WEBHOOK_URL=https://n8n-app.calmcoast-298a6aef.centralindia.azurecontainerapps.io/webhook/wb-ops-agent" >> "$GITHUB_ENV"
          fi

      - name: Run Database Migrations (Pre-Deployment Gate)
        id: db-migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_DB_HOST: ${{ secrets.AZURE_DB_HOST }}
          AZURE_DB_USER: ${{ secrets.AZURE_DB_USER }}
          AZURE_DB_PASSWORD: ${{ secrets.AZURE_DB_PASSWORD }}
          AZURE_DB_NAME: ${{ secrets.AZURE_DB_NAME }}
          AZURE_DB_PORT: ${{ secrets.AZURE_DB_PORT }}
          NODE_ENV: "production"
          WEBSITEBANJA_RUNTIME_MODE: "production"
          DATABASE_SSL_REJECT_UNAUTHORIZED: "true"
        run: |
          echo "Executing authoritative database migration runner with advisory locking..."
          
          # 1. Resolve host/user/database/port from Container App if not provided via secrets
          if [ -z "$DATABASE_URL" ] && [ -z "$AZURE_DB_USER" ]; then
            echo "Resolving DB configuration from Azure Container App environment..."
            APP_JSON=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" -o json 2>/dev/null || echo "{}")
            RESOLVED_HOST=$(echo "$APP_JSON" | jq -r '.properties.template.containers[0].env[]? | select(.name=="AZURE_DB_HOST") | .value // empty' 2>/dev/null || echo "")
            RESOLVED_USER=$(echo "$APP_JSON" | jq -r '.properties.template.containers[0].env[]? | select(.name=="AZURE_DB_USER") | .value // empty' 2>/dev/null || echo "")
            RESOLVED_DB=$(echo "$APP_JSON" | jq -r '.properties.template.containers[0].env[]? | select(.name=="AZURE_DB_NAME") | .value // empty' 2>/dev/null || echo "")
            RESOLVED_PORT=$(echo "$APP_JSON" | jq -r '.properties.template.containers[0].env[]? | select(.name=="AZURE_DB_PORT") | .value // empty' 2>/dev/null || echo "")
            
            if [ -n "$RESOLVED_HOST" ]; then export AZURE_DB_HOST="$RESOLVED_HOST"; fi
            if [ -n "$RESOLVED_USER" ]; then export AZURE_DB_USER="$RESOLVED_USER"; fi
            if [ -n "$RESOLVED_DB" ]; then export AZURE_DB_NAME="$RESOLVED_DB"; fi
            if [ -n "$RESOLVED_PORT" ]; then export AZURE_DB_PORT="$RESOLVED_PORT"; fi
          fi

          # Safe defaults for Azure Flexible Server if still unset
          if [ -z "$AZURE_DB_HOST" ]; then export AZURE_DB_HOST="websitebanja-db.postgres.database.azure.com"; fi
          if [ -z "$AZURE_DB_USER" ]; then export AZURE_DB_USER="websitebanjaadmin"; fi
          if [ -z "$AZURE_DB_NAME" ]; then export AZURE_DB_NAME="postgres"; fi
          if [ -z "$AZURE_DB_PORT" ]; then export AZURE_DB_PORT="5432"; fi

          # 2. Resolve database password from Container App secret store with --show-values
          if [ -z "$AZURE_DB_PASSWORD" ] && [ -z "$DATABASE_URL" ]; then
            echo "Resolving AZURE_DB_PASSWORD from Container App secret store..."
            SECRETS_JSON=$(az containerapp secret list --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --show-values -o json 2>/dev/null || echo "[]")
            DB_PW=$(echo "$SECRETS_JSON" | jq -r '.[]? | select(.name=="azure-db-password") | .value // empty' 2>/dev/null || echo "")
            if [ -z "$DB_PW" ]; then
              DB_PW=$(az containerapp secret show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --secret-name azure-db-password --show-values --query value -o tsv 2>/dev/null || echo "")
            fi
            if [ -n "$DB_PW" ]; then export AZURE_DB_PASSWORD="$DB_PW"; fi
          fi

          # 3. Setup trusted Root CA for PostgreSQL TLS verification (enforce rejectUnauthorized: true)
          echo "Setting up trusted CA for production PostgreSQL TLS verification..."
          mkdir -p /tmp/certs
          curl -fsSL https://dl.cacerts.digicert.com/DigiCertGlobalRootCA.crt.pem -o /tmp/certs/DigiCertGlobalRootCA.crt.pem 2>/dev/null || true
          curl -fsSL https://cacerts.digicert.com/DigiCertGlobalRootG2.crt.pem -o /tmp/certs/DigiCertGlobalRootG2.crt.pem 2>/dev/null || true
          if ls /tmp/certs/*.crt.pem 1>/dev/null 2>&1; then
            cat /tmp/certs/*.crt.pem > /tmp/azure-pg-ca.pem
            export DATABASE_SSL_CA="$(cat /tmp/azure-pg-ca.pem)"
            echo "Loaded trusted DigiCert Root CA bundle for Azure PostgreSQL."
          fi
          export DATABASE_SSL_REJECT_UNAUTHORIZED="true"

          # 4. Ensure firewall access on Azure Database for PostgreSQL Flexible Server for GitHub runner
          SERVER_NAME="websitebanja-db"
          RUNNER_IP=$(curl -fsSL https://api.ipify.org 2>/dev/null || curl -fsSL https://ifconfig.me 2>/dev/null || echo "")
          ADDED_FIREWALL_RULE=0
          if [ -n "$RUNNER_IP" ]; then
            echo "Adding temporary Azure PostgreSQL firewall rule for runner IP: $RUNNER_IP..."
            if az postgres flexible-server firewall-rule create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$SERVER_NAME" \
              --rule-name "gh-actions-runner-gate" \
              --start-ip-address "$RUNNER_IP" \
              --end-ip-address "$RUNNER_IP" 2>/dev/null; then
              ADDED_FIREWALL_RULE=1
              echo "Firewall rule created."
            else
              echo "Firewall rule creation skipped or not needed (Azure network rules already apply)."
            fi
          fi

          echo "Target Host: $AZURE_DB_HOST, User: $AZURE_DB_USER, DB: $AZURE_DB_NAME, Port: $AZURE_DB_PORT, Password set: $([ -n "$AZURE_DB_PASSWORD" ] && echo 'yes' || echo 'no')"

          # Execute Authoritative Migration Runner
          set +e
          node scripts/run_migrations.mjs 2>&1 | tee /tmp/migration_output.log
          MIG_EXIT=${PIPESTATUS[0]}
          set -e

          # Cleanup temporary firewall rule if created
          if [ "$ADDED_FIREWALL_RULE" -eq 1 ]; then
            echo "Removing temporary firewall rule..."
            az postgres flexible-server firewall-rule delete \
              --resource-group "$RESOURCE_GROUP" \
              --name "$SERVER_NAME" \
              --rule-name "gh-actions-runner-gate" \
              --yes 2>/dev/null || true
          fi

          if [ "$MIG_EXIT" -ne 0 ]; then
            echo "MIGRATION_ERROR<<EOF" >> "$GITHUB_ENV"
            tail -n 40 /tmp/migration_output.log >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
            exit "$MIG_EXIT"
          fi

      - name: Deploy Image & Configure Azure Environment
        id: deploy
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ env.CONTAINER_APP_NAME }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          WEBSITEBANJA_AUTOMATION_SECRET: ${{ secrets.WEBSITEBANJA_AUTOMATION_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          NEXT_PUBLIC_APP_URL: "https://websitebanja.com"
          GMAIL_REDIRECT_URI: "https://websitebanja.com/api/integrations/gmail/callback"
          WEBSITEBANJA_RUNTIME_MODE: "production"
          COMMUNICATION_DRY_RUN: "false"
          N8N_OPS_AGENT_WEBHOOK_URL: ${{ env.N8N_OPS_AGENT_WEBHOOK_URL }}
          IMAGE_TAG: ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          node scripts/configure_azure_razorpay.mjs

      - name: Verify Provisioning State & Health
        id: verify
        run: |
          echo "Verifying Container App provisioning status..."
          PROVISIONING_STATE=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.provisioningState" -o tsv)

          echo "Provisioning State: $PROVISIONING_STATE"
          if [ "$PROVISIONING_STATE" != "Succeeded" ]; then
            echo "::error::Container App provisioning did not succeed (state: $PROVISIONING_STATE)"
            exit 1
          fi

          APP_FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          LATEST_REVISION=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.latestRevisionName" -o tsv)

          APP_URL="https://${APP_FQDN}"
          echo "APP_URL=${APP_URL}" >> "$GITHUB_ENV"
          echo "APP_FQDN=${APP_FQDN}" >> "$GITHUB_ENV"
          echo "LATEST_REVISION=${LATEST_REVISION}" >> "$GITHUB_ENV"
          echo "Live Application URL: ${APP_URL}"
          echo "Active Revision: ${LATEST_REVISION}"

      - name: Run Smoke Verification Tests
        env:
          WEBSITEBANJA_AUTOMATION_SECRET: ${{ secrets.WEBSITEBANJA_AUTOMATION_SECRET }}
        run: |
          echo "Executing automated smoke test against ${APP_URL}..."
          node azure-migration/11_smoke_test_container_app.mjs "${APP_URL}"

      - name: Ping IndexNow (post-deploy, non-fatal)
        if: success()
        continue-on-error: true
        run: |
          echo "Submitting public URLs to IndexNow after successful deployment..."
          node scripts/indexnow_ping.mjs || true
          echo "[IndexNow] Ping step completed (non-fatal)"

      - name: Publish Success Deployment Summary
        if: success()
        run: |
          echo "### 🚀 Azure Container Apps Deployment Succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Container App** | \`$CONTAINER_APP_NAME\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Resource Group** | \`$RESOURCE_GROUP\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image Tag** | \`$ACR_SERVER/$IMAGE_NAME:${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Active Revision** | \`${LATEST_REVISION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Live URL** | [${APP_URL}](${APP_URL}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | ✅ Healthy & Verified |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trigger** | \`${{ github.actor }}\` via \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Failure Deployment Summary
        if: failure()
        run: |
          echo "### ❌ Azure Container Apps Deployment Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Container App** | \`$CONTAINER_APP_NAME\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Resource Group** | \`$RESOURCE_GROUP\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Failed Commit SHA** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | ❌ Failed (Previous healthy revision preserved) |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$MIGRATION_ERROR" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Database Migration Diagnostics:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$MIGRATION_ERROR" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
