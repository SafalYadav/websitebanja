name: Continuous Deployment to Azure Container Apps

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/diagnose-db.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_SERVER: websitebanjacr.azurecr.io
  IMAGE_NAME: websitebanja
  CONTAINER_APP_NAME: websitebanja-app
  RESOURCE_GROUP: websitebanja-rg

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image (Immutable SHA + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-and-verify:
    name: Deploy to Azure Container Apps & Verify
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code (for smoke test script)
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Azure Authentication Secrets
        run: |
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "::error::AZURE_CLIENT_ID secret is not set in GitHub repository."
            echo "Please run './azure-migration/12_setup_github_oidc.sh' in Azure Cloud Shell"
            echo "and set AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID in GitHub Secrets."
            exit 1
          fi

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Razorpay Secrets & Environment Variables in Azure
        id: configure-razorpay
        run: |
          echo "Checking if Razorpay secrets are provided in GitHub Secrets..."
          if [ -n "${{ secrets.RAZORPAY_KEY_SECRET }}" ]; then
            echo "Registering encrypted razorpay-key-secret in Azure Container App Secret Store..."
            az containerapp secret set \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --secrets razorpay-key-secret="${{ secrets.RAZORPAY_KEY_SECRET }}" >/dev/null

            echo "Setting Razorpay environment variables in Container App..."
            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --set-env-vars \
                "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" \
                "NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" \
                "RAZORPAY_KEY_SECRET=secretref:razorpay-key-secret" >/dev/null
          fi

          echo "Verifying registered secret names in Azure Container App:"
          az containerapp secret list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[].name" -o tsv | sed 's/^/  - /'

          echo "Verifying environment variable names in Azure Container App:"
          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[].name" -o tsv | sed 's/^/  - /'

      - name: Deploy Immutable Image to Container App
        id: deploy
        run: |
          echo "Deploying immutable image $ACR_SERVER/$IMAGE_NAME:${{ github.sha }} to Container App $CONTAINER_APP_NAME..."
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_SERVER/$IMAGE_NAME:${{ github.sha }}"

      - name: Verify Provisioning State & Health
        id: verify
        run: |
          echo "Verifying Container App provisioning status..."
          PROVISIONING_STATE=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.provisioningState" -o tsv)

          echo "Provisioning State: $PROVISIONING_STATE"
          if [ "$PROVISIONING_STATE" != "Succeeded" ]; then
            echo "::error::Container App provisioning did not succeed (state: $PROVISIONING_STATE)"
            exit 1
          fi

          APP_FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          LATEST_REVISION=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.latestRevisionName" -o tsv)

          APP_URL="https://${APP_FQDN}"
          echo "APP_URL=${APP_URL}" >> "$GITHUB_ENV"
          echo "APP_FQDN=${APP_FQDN}" >> "$GITHUB_ENV"
          echo "LATEST_REVISION=${LATEST_REVISION}" >> "$GITHUB_ENV"
          echo "Live Application URL: ${APP_URL}"
          echo "Active Revision: ${LATEST_REVISION}"

      - name: Run Smoke Verification Tests
        run: |
          echo "Executing automated smoke test against ${APP_URL}..."
          node azure-migration/11_smoke_test_container_app.mjs "${APP_URL}"

      - name: Ping IndexNow (post-deploy, non-fatal)
        if: success()
        continue-on-error: true
        run: |
          echo "Submitting public URLs to IndexNow after successful deployment..."
          node scripts/indexnow_ping.mjs || true
          echo "[IndexNow] Ping step completed (non-fatal)"

      - name: Publish Success Deployment Summary
        if: success()
        run: |
          echo "### 🚀 Azure Container Apps Deployment Succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Container App** | \`$CONTAINER_APP_NAME\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Resource Group** | \`$RESOURCE_GROUP\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image Tag** | \`$ACR_SERVER/$IMAGE_NAME:${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Active Revision** | \`${LATEST_REVISION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Live URL** | [${APP_URL}](${APP_URL}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | ✅ Healthy & Verified |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trigger** | \`${{ github.actor }}\` via \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Failure Deployment Summary
        if: failure()
        run: |
          echo "### ❌ Azure Container Apps Deployment Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Container App** | \`$CONTAINER_APP_NAME\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Resource Group** | \`$RESOURCE_GROUP\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Failed Commit SHA** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | ❌ Failed (Previous healthy revision preserved) |" >> "$GITHUB_STEP_SUMMARY"
