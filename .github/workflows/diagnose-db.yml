name: Diagnose Azure PostgreSQL

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-db.yml'

permissions:
  id-token: write
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pg
        run: npm install pg

      - name: Run Diagnostics and Save JSON
        env:
          AZURE_DB_HOST: websitebanja-db.postgres.database.azure.com
          AZURE_DB_USER: websitebanjaadmin
          AZURE_DB_PASSWORD: ${{ secrets.AZURE_DB_PASSWORD || 'fizSy8-xaxves-catdos' }}
        run: |
          node -e "
          const { execSync } = require('child_process');
          const fs = require('fs');
          const { Client } = require('pg');

          const report = {
            timestamp: new Date().toISOString(),
            firewallBefore: null,
            firewallCreateAzureResult: null,
            firewallCreateAllResult: null,
            firewallAfter: null,
            dbQuery: null
          };

          try {
            report.firewallBefore = JSON.parse(execSync('az postgres flexible-server firewall-rule list --resource-group websitebanja-rg --server-name websitebanja-db -o json').toString());
          } catch (e) {
            report.firewallBeforeError = e.message;
          }

          // 1. Allow all Azure services (0.0.0.0)
          try {
            console.log('Creating firewall rule AllowAllAzureServices (0.0.0.0)...');
            const out1 = execSync('az postgres flexible-server firewall-rule create --resource-group websitebanja-rg --server-name websitebanja-db --name AllowAllAzureServices --start-ip-address 0.0.0.0 --end-ip-address 0.0.0.0 -o json').toString();
            report.firewallCreateAzureResult = JSON.parse(out1);
            console.log('AllowAllAzureServices created successfully!');
          } catch (e) {
            console.error('Error creating AllowAllAzureServices rule:', e.message);
            report.firewallCreateAzureError = e.message;
          }

          // 2. Allow all IPs (0.0.0.0 - 255.255.255.255) for container app outbound IPs + dev
          try {
            console.log('Creating firewall rule AllowAllIPs (0.0.0.0 - 255.255.255.255)...');
            const out2 = execSync('az postgres flexible-server firewall-rule create --resource-group websitebanja-rg --server-name websitebanja-db --name AllowAllIPs --start-ip-address 0.0.0.0 --end-ip-address 255.255.255.255 -o json').toString();
            report.firewallCreateAllResult = JSON.parse(out2);
            console.log('AllowAllIPs created successfully!');
          } catch (e) {
            console.error('Error creating AllowAllIPs rule:', e.message);
            report.firewallCreateAllError = e.message;
          }

          try {
            report.firewallAfter = JSON.parse(execSync('az postgres flexible-server firewall-rule list --resource-group websitebanja-rg --server-name websitebanja-db -o json').toString());
          } catch (e) {
            report.firewallAfterError = e.message;
          }

          // 3. Query Database
          async function queryDb() {
            const client = new Client({
              host: process.env.AZURE_DB_HOST,
              port: 5432,
              user: process.env.AZURE_DB_USER,
              password: process.env.AZURE_DB_PASSWORD,
              database: 'postgres',
              ssl: { rejectUnauthorized: false },
              connectionTimeoutMillis: 15000,
            });

            try {
              console.log('Connecting to PostgreSQL from runner...');
              await client.connect();
              console.log('Connected to PostgreSQL successfully!');

              const count = await client.query('SELECT COUNT(*) FROM public.projects');
              console.log('Total projects in DB:', count.rows[0].count);

              const sample = await client.query('SELECT id, user_id, name, is_published, created_at, updated_at FROM public.projects ORDER BY updated_at DESC LIMIT 10');
              const users = await client.query('SELECT COUNT(DISTINCT user_id) as total_users FROM public.projects');
              const distinctUsers = await client.query('SELECT DISTINCT user_id FROM public.projects');
              const subs = await client.query('SELECT COUNT(*) as total_subs FROM public.subscriptions');
              const pk = await client.query('SELECT COUNT(*) as total_pk FROM public.project_knowledge');

              report.dbQuery = {
                success: true,
                projectCount: parseInt(count.rows[0].count, 10),
                uniqueUsers: parseInt(users.rows[0].total_users, 10),
                userIds: distinctUsers.rows.map(r => r.user_id),
                subscriptionsCount: parseInt(subs.rows[0].total_subs, 10),
                knowledgeCount: parseInt(pk.rows[0].total_pk, 10),
                sampleProjects: sample.rows,
              };
            } catch (err) {
              console.error('DB query error:', err.message);
              report.dbQuery = {
                success: false,
                error: err.message,
                code: err.code,
              };
            } finally {
              await client.end().catch(() => {});
            }

            fs.writeFileSync('diagnose_result.json', JSON.stringify(report, null, 2));
            console.log('diagnose_result.json written successfully.');
          }

          queryDb();
          "

      - name: Commit and Push Report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnose_result.json
          git commit -m "chore: apply Azure PostgreSQL firewall rules and query database [skip ci]" || exit 0
          git push origin main
