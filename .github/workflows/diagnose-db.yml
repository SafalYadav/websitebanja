name: Diagnose Azure PostgreSQL

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-db.yml'

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect Azure Resources
        id: inspect
        run: |
          echo "## Azure Diagnostic Report" >> $GITHUB_STEP_SUMMARY
          echo "### 1. Resources in Resource Group websitebanja-rg" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          az resource list --resource-group websitebanja-rg --output json >> $GITHUB_STEP_SUMMARY 2>&1 || echo "Error listing resources" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### 2. Azure PostgreSQL Server Details" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          az postgres flexible-server show --resource-group websitebanja-rg --name websitebanja-db --output json >> $GITHUB_STEP_SUMMARY 2>&1 || echo "Error showing server" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### 3. Azure PostgreSQL Firewall Rules" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          az postgres flexible-server firewall-rule list --resource-group websitebanja-rg --name websitebanja-db --output json >> $GITHUB_STEP_SUMMARY 2>&1 || echo "Error listing firewall rules" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pg
        run: npm install pg

      - name: Query Database Directly
        continue-on-error: true
        env:
          AZURE_DB_HOST: websitebanja-db.postgres.database.azure.com
          AZURE_DB_USER: websitebanjaadmin
          AZURE_DB_PASSWORD: ${{ secrets.AZURE_DB_PASSWORD || 'fizSy8-xaxves-catdos' }}
        run: |
          echo "### 4. Direct Node.js Query Attempt" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          node -e "
          const { Client } = require('pg');
          const client = new Client({
            host: process.env.AZURE_DB_HOST,
            port: 5432,
            user: process.env.AZURE_DB_USER,
            password: process.env.AZURE_DB_PASSWORD,
            database: 'postgres',
            ssl: { rejectUnauthorized: false },
            connectionTimeoutMillis: 8000,
          });

          async function check() {
            try {
              console.log('Connecting to PostgreSQL...');
              await client.connect();
              console.log('Connected successfully!');

              const count = await client.query('SELECT COUNT(*) FROM public.projects');
              console.log('Total projects in public.projects:', count.rows[0].count);

              const sample = await client.query('SELECT id, user_id, name, is_published, created_at, updated_at FROM public.projects ORDER BY updated_at DESC LIMIT 5');
              console.log('Sample projects:');
              console.log(JSON.stringify(sample.rows, null, 2));
            } catch (err) {
              console.error('Query error:', err.message);
              if (err.cause) console.error('Cause:', err.cause);
            } finally {
              await client.end().catch(() => {});
            }
          }
          check();
          " >> $GITHUB_STEP_SUMMARY 2>&1
          echo '```' >> $GITHUB_STEP_SUMMARY
